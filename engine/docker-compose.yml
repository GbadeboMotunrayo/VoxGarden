# VoxGarden audio engine: shared Icecast (delivery).
# Playout is one Liquidsoap container per station, started by the control platform
# (apps/control/src/engine.ts) on the network this file creates (engine_default).
# Secrets live in engine/.env (git-ignored): see engine/.env.example
services:
  icecast:
    image: moul/icecast
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_RELAY_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
