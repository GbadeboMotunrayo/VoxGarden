# Engine spike (our own engine). Separate ports from the main engine.
name: vg-engine-spike
services:
  icecast:
    image: moul/icecast
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_RELAY_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
    ports: ["127.0.0.1:8100:8000"]
  liquidsoap:
    image: savonet/liquidsoap:v2.3.2
    command: ["/spike/spike.liq"]
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      HARBOR_PASSWORD: ${HARBOR_PASSWORD}
    volumes:
      - ./spike.liq:/spike/spike.liq:ro
      - ./media:/media:ro
    ports:
      - "127.0.0.1:8105:8005"   # live input (harbor)
      - "127.0.0.1:1235:1234"   # telnet control
    depends_on: [icecast]
